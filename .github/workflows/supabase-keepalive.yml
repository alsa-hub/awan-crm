# نبضة إبقاء مشروع Supabase حيّاً
# الخطة المجانية توقف المشروع بعد ٧ أيام خمول، فيتعطّل تسجيل الدخول في crm.awan.coffee.
# هذا الطلب اليومي يلمس جدولاً حقيقياً في القاعدة فيبقى المشروع نشطاً.
name: Supabase keepalive

on:
  schedule:
    - cron: "0 3 * * *" # يومياً ٠٣:٠٠ UTC — ٠٦:٠٠ بتوقيت الرياض
  workflow_dispatch: # للتشغيل اليدوي عند الحاجة

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        env:
          SUPABASE_URL: https://fglzyryytvzgrmxshwyg.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "::error::السر SUPABASE_ANON_KEY غير معرّف في إعدادات الريبو (Settings → Secrets and variables → Actions)."
            exit 1
          fi

          status=$(curl -sS -o /tmp/body.txt -w '%{http_code}' \
            --max-time 30 --retry 3 --retry-delay 10 --retry-all-errors \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL}/rest/v1/app_users?select=id&limit=1")

          echo "HTTP ${status}"
          if [ "${status}" != "200" ]; then
            echo "::error::فشلت النبضة — رمز ${status}"
            cat /tmp/body.txt
            exit 1
          fi
          echo "المشروع نشط ✅"
